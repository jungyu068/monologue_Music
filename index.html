<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roy Music — 실장님의 음악</title>
<style>
  :root {
    --bg: #0b0b12;
    --card: #14141d;
    --accent: #c9a86a;
    --accent2: #e8d5a8;
    --text: #eae6dc;
    --dim: #8a8578;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    overflow-x: hidden;
  }
  /* 히어로 — 실사 커버 콜라주 배경 */
  .hero {
    position: relative;
    min-height: 92vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transform: scale(1.08);
    filter: brightness(0.35) saturate(0.9);
    animation: slowZoom 30s ease-in-out infinite alternate;
  }
  @keyframes slowZoom { from { transform: scale(1); } to { transform: scale(1.12); } }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 30%, var(--bg) 95%);
  }
  .hero-content {
    position: relative; z-index: 2;
    text-align: center; padding: 40px 20px;
  }
  .hero-title {
    font-size: clamp(40px, 8vw, 88px);
    font-weight: 300;
    letter-spacing: 6px;
    color: var(--accent2);
    text-shadow: 0 2px 30px rgba(0,0,0,0.6);
  }
  .hero-sub {
    margin-top: 18px;
    font-size: clamp(14px, 2vw, 19px);
    color: var(--dim);
    letter-spacing: 3px;
  }
  .hero-line {
    width: 60px; height: 1px;
    background: var(--accent);
    margin: 26px auto 0;
  }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    padding: 18px 36px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(180deg, rgba(11,11,18,0.9), transparent);
  }
  nav .logo { font-size: 17px; font-weight: 600; color: var(--accent2); letter-spacing: 2px; }
  nav .links a {
    color: var(--dim); text-decoration: none;
    font-size: 13px; margin-left: 26px; letter-spacing: 1px;
    transition: color 0.2s;
  }
  nav .links a:hover { color: var(--accent2); }
  section { padding: 90px 40px 40px; max-width: 1280px; margin: 0 auto; }
  .section-title {
    font-size: 15px; color: var(--accent);
    letter-spacing: 4px; margin-bottom: 40px;
    display: flex; align-items: center; gap: 16px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: #222; }
  /* 앨범 그리드 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 26px;
  }
  .album-card {
    cursor: pointer;
    transition: transform 0.3s ease;
  }
  .album-card:hover { transform: translateY(-6px); }
  .album-cover {
    width: 100%; aspect-ratio: 1;
    border-radius: 10px;
    object-fit: cover;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: box-shadow 0.3s;
  }
  .album-card:hover .album-cover { box-shadow: 0 16px 40px rgba(201,168,106,0.15); }
  .album-name {
    margin-top: 12px; font-size: 14px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .album-count { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .ep-btn {
    display: inline-block; margin-top: 8px;
    padding: 5px 12px; border-radius: 14px;
    background: rgba(201,168,106,0.12); color: var(--accent2);
    font-size: 11px; letter-spacing: 0.5px;
    border: 1px solid rgba(201,168,106,0.3);
    transition: all 0.2s;
  }
  .album-card:hover .ep-btn { background: var(--accent); color: #111; }
  /* 모달 */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(5,5,10,0.85);
    backdrop-filter: blur(14px);
    display: none; align-items: center; justify-content: center;
    padding: 30px;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: var(--card);
    border: 1px solid #222;
    border-radius: 16px;
    max-width: 640px; width: 100%;
    max-height: 85vh; overflow-y: auto;
    padding: 36px;
  }
  .modal-head { display: flex; gap: 22px; align-items: center; margin-bottom: 28px; }
  .modal-cover {
    width: 120px; height: 120px; border-radius: 10px; object-fit: cover;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .modal-title { font-size: 22px; font-weight: 600; color: var(--accent2); }
  .modal-count { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .song-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-radius: 8px;
    cursor: pointer; transition: background 0.15s;
    font-size: 14px;
  }
  .song-row:hover { background: #1d1d2a; }
  .song-num { color: var(--dim); font-size: 11px; width: 22px; text-align: right; }
  .song-row:hover .song-num { color: var(--accent); }
  .close-btn {
    position: absolute; top: 26px; right: 30px;
    background: none; border: 1px solid #333; color: var(--dim);
    width: 38px; height: 38px; border-radius: 50%;
    font-size: 16px; cursor: pointer;
    transition: all 0.2s;
  }
  .close-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .lang-tab {
    background: var(--card); border: 1px solid #2a2a3a; color: var(--dim);
    padding: 9px 20px; border-radius: 24px; cursor: pointer;
    font-size: 13px; letter-spacing: 1px; transition: all 0.2s;
  }
  .lang-tab:hover { border-color: var(--accent); color: var(--text); }
  .lang-tab.active {
    background: var(--accent); color: #111; border-color: var(--accent);
    font-weight: 600;
  }
  /* 푸터 */
  footer {
    text-align: center; padding: 70px 20px 40px;
    color: var(--dim); font-size: 12px; letter-spacing: 2px;
  }
  footer .heart { color: var(--accent); }
  @media (max-width: 600px) {
    nav .links a { margin-left: 16px; font-size: 12px; }
    section { padding: 70px 20px 30px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">ROY MUSIC</div>
  <div class="links">
    <a href="#albums">ALBUMS</a>
    <a href="https://www.youtube.com/@jungyu068" target="_blank">YOUTUBE</a>
    <a href="https://www.youtube.com/@Roy-News-Factory" target="_blank">NEWS</a>
  </div>
</nav>

<div class="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-content">
    <div class="hero-title">ROY MUSIC</div>
    <div class="hero-sub">실장님의 음악 · 마스터링 완료 · 전곡 감상</div>
    <div class="hero-line"></div>
  </div>
</div>

<section id="albums">
  <div class="section-title">ALBUMS</div>
  <!-- 언어 탭 (실장님 확정 2026-08: 한국/영어 분리!) -->
  <div style="display:flex; gap:10px; margin-bottom:28px; flex-wrap:wrap;">
    <button class="lang-tab active" data-lang="all">ALL</button>
    <button class="lang-tab" data-lang="ko">🇰🇷 KOREAN</button>
    <button class="lang-tab" data-lang="en">🍁 ENGLISH (CA)</button>
  </div>
  <div class="grid" id="album-grid"></div>
</section>

<!-- 기부 섹션 (사장님 확정 2026-08! PayPal: jungyu068@gmail.com) -->
<section id="support">
  <div class="section-title">SUPPORT</div>
  <div style="text-align:center; padding: 20px 0 40px;">
    <p style="color:var(--dim); font-size:14px; line-height:1.9; margin-bottom:24px;">
      이 음악이 마음에 드셨다면 작은 응원이 큰 힘이 됩니다.<br>
      커피 한 잔의 온기가 새로운 곡을 만듭니다. ☕
    </p>
    <form action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_blank">
      <input type="hidden" name="cmd" value="_donations">
      <input type="hidden" name="business" value="jungyu068@gmail.com">
      <input type="hidden" name="currency_code" value="CAD">
      <input type="hidden" name="item_name" value="Roy Music Support">
      <button type="submit"
              style="padding:14px 36px; border:none; border-radius:40px;
                     background:var(--accent); color:#111; font-size:15px; font-weight:600;
                     letter-spacing:1px; cursor:pointer;
                     transition:transform 0.2s, box-shadow 0.2s;">
        ☕ 기부하기 (PayPal)
      </button>
    </form>
  </div>
</section>

<footer>
  <p>ROY MUSIC — <span class="heart">♥</span> MADE WITH LOVE</p>
</footer>

<div class="modal" id="modal">
  <button class="close-btn" id="modal-close">✕</button>
  <div class="modal-box" id="modal-box"></div>
</div>

<script>
let albums = [];
let heroCovers = [];
let currentLang = 'all';

fetch('albums.json').then(r => r.json()).then(data => {
  albums = data;
  heroCovers = data.filter(a => a.cover_file).map(a => a.cover_file);
  render();
  // 히어로 배경 = 랜덤 실사 커버!
  if (heroCovers.length) {
    const bg = document.getElementById('hero-bg');
    bg.style.backgroundImage = `url(${heroCovers[Math.floor(Math.random() * heroCovers.length)]})`;
  }
});

// 언어 탭!
document.querySelectorAll('.lang-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.lang-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentLang = tab.dataset.lang;
    render();
  });
});

function render() {
  const grid = document.getElementById('album-grid');
  const list = currentLang === 'all'
    ? albums
    : albums.filter(a => a.lang === currentLang);
  grid.innerHTML = list.map((a, i) => `
    <div class="album-card" data-idx="${i}">
      ${a.cover_file
        ? `<img class="album-cover" src="${a.cover_file}" alt="${a.name}" loading="lazy">`
        : `<div class="album-cover" style="background:linear-gradient(135deg,#1a1a28,#222)"></div>`}
      <div class="album-name">${a.lang === 'ko' ? '🇰🇷 ' : '🍁 '}${a.name}</div>
      <div class="album-count">${a.songs.length} TRACKS</div>
      ${a.ep_url
        ? `<div class="ep-btn">▶ EP 영상</div>`
        : `<div class="ep-btn ch-btn">▶ 채널에서 듣기</div>`}
    </div>`).join('');
  grid.querySelectorAll('.album-card').forEach(card => {
    // EP 버튼 → EP 영상 바로!
    const epBtn = card.querySelector('.ep-btn');
    if (epBtn) {
      epBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(card.dataset.idx);
        const realIdx = albums.indexOf(list[idx]);
        const a = albums[realIdx];
        if (a.ep_url) {
          window.open('https://youtu.be/' + a.ep_url, '_blank');
        } else {
          // EP 없으면 채널 검색으로!
          window.open('https://www.youtube.com/@jungyu068/search?query=' + encodeURIComponent(a.name), '_blank');
        }
      });
    }
    card.addEventListener('click', () => {
      const idx = parseInt(card.dataset.idx);
      const realIdx = albums.indexOf(list[idx]);
      openModal(realIdx);
    });
  });
}

function openModal(idx) {
  const a = albums[idx];
  const box = document.getElementById('modal-box');
  box.innerHTML = `
    <div class="modal-head">
      ${a.cover_file
        ? `<img class="modal-cover" src="${a.cover_file}" alt="">`
        : `<div class="modal-cover" style="background:#222"></div>`}
      <div>
        <div class="modal-title">${a.name}</div>
        <div class="modal-count">${a.songs.length} TRACKS</div>
      </div>
    </div>
    <div style="font-size:12px;color:var(--dim);margin-bottom:14px;">▶ 곡을 클릭하면 우리 채널 EP에서 바로 들을 수 있어요!</div>
    ${a.songs.map((s, i) => `
      <div class="song-row" data-yt="${encodeURIComponent(s.title + ' ' + a.name)}">
        <span class="song-num">${i + 1}</span>
        <span style="flex:1">${s.title}</span>
        <span style="color:var(--dim);font-size:11px;">▶ 유튜브</span>
      </div>`).join('')}`;
  // 곡 클릭 → 우리 채널에서 검색! (EP 영상 연결!)
  box.querySelectorAll('.song-row').forEach(row => {
    row.addEventListener('click', () => {
      window.open('https://www.youtube.com/@jungyu068/search?query=' + row.dataset.yt, '_blank');
    });
  });
  document.getElementById('modal').classList.add('open');
}

document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('open');
});
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
});
</script>
</body>
</html>
